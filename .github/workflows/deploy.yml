name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
          NEXT_PUBLIC_SITE_URL: https://wunderlich-elektrotechnik.de

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 202.61.233.9
          username: hosting241154
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /wunderlich-elektrotechnik.de/httpdocs/
          protocol: ftps
          port: 21
